name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/debug/gateway
            target/debug/site-sim

  eebus-bridge:
    name: EEBUS bridge (Go, eebus-go) and LPC against eebus-go's energy guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eebus-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: eebus-bridge/go.mod
          cache-dependency-path: eebus-bridge/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet -tags e2e ./...
      - run: go test ./...
      - run: go test -tags e2e -run TestEnergyGuard -v ./...

  interop:
    name: Interoperability — c104 (lib60870) as control centre
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: target/debug
      - run: chmod +x target/debug/gateway target/debug/site-sim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r interop/requirements.txt
      - run: sh certs/gen-demo.sh
      - run: python -m pytest -v interop

  pages:
    name: Build the WebAssembly demo
    needs: [rust, interop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.128
      - run: cargo build --release -p web-demo --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --no-typescript --out-dir web/pkg target/wasm32-unknown-unknown/release/web_demo.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
