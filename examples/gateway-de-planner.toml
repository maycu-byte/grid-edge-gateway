# The demo depot in Germany with the planning layer on: a model-predictive
# planner schedules battery, cars and heat pump every 15 minutes against
# real day-ahead prices, a demand charge and the weather forecast, and the
# real-time layer follows the plan within the rules.
#
#   ENTSOE_TOKEN=... ./target/debug/gateway examples/gateway-de-planner.toml
#   ./target/debug/site-sim --start now            # the simulated sun at today's hour
#   curl localhost:8080/api/plan                   # the plan in force
#
# Without ENTSOE_TOKEN the prices come from Energy-Charts (Fraunhofer ISE,
# open data from SMARD); the forecast comes from Open-Meteo. Both need
# internet access; without it the site runs on rules alone.

[site]
# Rules the DSO commands are applied under: "DE" (default), "AT" or "CH".
# jurisdiction = "DE"
pv_installed_kw = 120.0
connection_kw = 250.0       # grid connection rating; readings far beyond it are implausible
# expected_annual_yield_kwh = 120000.0   # for curtailment budgets (CH); default 1,000 kWh/kWp
# "grid_connection_point": the DSO feed-in limit applies to export at the
# grid connection; "plant_output": to the inverters' output itself.
feed_in_reference = "grid_connection_point"
release_ramp_s = 300.0      # hand power back gradually after a dimming
# release_delay_max_s = 600.0 # first wait a random 0–600 s, so sites released together do not ramp up together
site_id = "demo-depot"      # name in the compliance reports, written to reports/ next to this file
pv_follow_timeout_s = 30.0  # an inverter above its limit this long is reported (IOA 2008)
pv_ramp_pct_per_s = 0.17    # PV limit raised by at most ~10% of installed power per minute
import_target_kw = 0.0      # battery discharges to keep grid import at or below this
margin_kw = 0.3             # headroom below every limit
min_dwell_s = 300.0         # min time before a car is rotated in or out
deadline_guard_s = 900.0    # a car with less slack than this before departure charges at full power
surplus_hold_s = 30.0       # while dimmed, count on the lowest PV surplus of this many seconds
control_period_ms = 1000
stale_after_ms = 3000       # a device silent for this long counts as offline

[[inverter]]
address = "127.0.0.1:5020"
[[inverter]]
address = "127.0.0.1:5021"

[meter]
address = "127.0.0.1:5022"

# Chargers fall back to 6 A (4.14 kW) on their own if the gateway goes
# silent for 30 s, which keeps even a crashed gateway within §14a.
[[charger]]
address = "127.0.0.1:5023"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30
[[charger]]
address = "127.0.0.1:5024"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30
[[charger]]
address = "127.0.0.1:5025"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30
[[charger]]
address = "127.0.0.1:5026"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30

[[heat_pump]]
address = "127.0.0.1:5027"
rated_kw = 14.0
min_kw = 3.0

# The battery counts as a controllable device under §14a and goes idle on
# its own if the gateway is silent for 30 s.
[[battery]]
address = "127.0.0.1:5028"
capacity_kwh = 100.0
max_charge_kw = 50.0
max_discharge_kw = 50.0
min_soc_pct = 10.0
max_soc_pct = 95.0
watchdog_s = 30

[iec104]
bind = "0.0.0.0:2404"
common_address = 1
deadband_kw = 1.0
# Without any control centre connected: "hold" the last commands (default),
# or "release" dim and feed-in limit after link_loss_release_s seconds.
on_link_loss = "hold"
link_loss_release_s = 900
# Uncomment for TLS with mutual authentication (IEC 62351-3 style).
# See certs/README.md to generate demo certificates.
# [iec104.tls]
# cert = "certs/demo/station.pem"
# key = "certs/demo/station.key.pem"
# client_ca = "certs/demo/ca.pem"

[api]
bind = "127.0.0.1:8080"
web_root = "web"

# ---------------------------------------------------------------- planning
[planner]
# "deterministic", "chance" (with epsilon = 0.05) or "robust".
uncertainty = "deterministic"
# Dimming the DSO has announced as recurring, local time. A dimming in
# progress is always expected to last up to 2 hours.
dim_windows = ["17:30-19:30"]
battery_degradation_eur_per_kwh = 0.03

[planner.prices]
# Tried in order. "entsoe" needs the security token of an ENTSO-E
# Transparency Platform account in the ENTSOE_TOKEN environment variable.
sources = ["entsoe", "energy-charts"]
# bidding_zone = "DE-LU"        # default: the jurisdiction's zone (DE-LU, AT, CH)
import_adder_eur_kwh = 0.12     # grid fees, levies and taxes on top of the day-ahead price
# export_fixed_eur_kwh = 0.08   # a fixed feed-in payment; default: the day-ahead price
refresh_s = 3600

[planner.weather]
# The modules: a depot roof near Saarbrücken, 15° towards the south.
latitude = 49.23
longitude = 7.00
tilt_deg = 15.0
azimuth_deg = 0.0               # 0 = south, −90 = east, 90 = west
performance_ratio = 0.85
refresh_s = 3600

[planner.demand_charge]
eur_per_kw_year = 100.0         # Leistungspreis on the year's highest quarter-hour of import
billing = "year"
peak_floor_kw = 40.0            # the site reaches this anyway: planning below it earns nothing

[planner.building]
# First-order thermal model of the building the heat pump heats.
ua_kw_per_k = 1.2
cap_kwh_per_k = 18.0
gains_day_kw = 3.0
gains_night_kw = 1.0
comfort_day_min_c = 20.0
comfort_night_min_c = 17.0
comfort_max_c = 23.0
day_start = "06:00"
day_end = "22:00"
cop_at_0c = 3.0                 # COP = 3.0 + 0.08 × outdoor °C
cop_per_k = 0.08
