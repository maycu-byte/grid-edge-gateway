# Demo site: a logistics depot with 120 kWp rooftop PV, four 22 kW chargers,
# a 14 kW heat pump and a 100 kWh battery. Addresses match `site-sim` defaults.
# Austrian rules (ElWG): the DSO capped feed-in of this new PV system at 70%
# of module peak power; consumption is only dimmed under a flexibility contract.

[site]
# Rules the DSO commands are applied under: "DE" (default), "AT" or "CH".
jurisdiction = "AT"
pv_installed_kw = 120.0
connection_kw = 250.0       # grid connection rating; readings far beyond it are implausible
# expected_annual_yield_kwh = 120000.0   # for curtailment budgets (CH); default 1,000 kWh/kWp
# "grid_connection_point": the DSO feed-in limit applies to export at the
# grid connection; "plant_output": to the inverters' output itself.
feed_in_reference = "grid_connection_point"
release_ramp_s = 300.0      # hand power back gradually after a dimming
pv_ramp_pct_per_s = 0.17    # PV limit raised by at most ~10% of installed power per minute
import_target_kw = 0.0      # battery discharges to keep grid import at or below this
margin_kw = 0.3             # headroom below every limit
min_dwell_s = 300.0         # min time before a car is rotated in or out
deadline_guard_s = 900.0    # a car with less slack than this before departure charges at full power
surplus_hold_s = 30.0       # while dimmed, count on the lowest PV surplus of this many seconds
control_period_ms = 1000
stale_after_ms = 3000       # a device silent for this long counts as offline

[policy]
static_feed_in_cap_pct = 70.0     # the cap the DSO set for this connection (up to 70)
contract_min_kw = 10.0             # contract: devices keep at least 10 kW while dimmed
contract_max_minutes_per_day = 120 # and the DSO may use it at most 2 hours a day

[[inverter]]
address = "127.0.0.1:5020"
[[inverter]]
address = "127.0.0.1:5021"

[meter]
address = "127.0.0.1:5022"

# Chargers fall back to 6 A (4.14 kW) on their own if the gateway goes
# silent for 30 s, which keeps even a crashed gateway within §14a.
[[charger]]
address = "127.0.0.1:5023"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30
[[charger]]
address = "127.0.0.1:5024"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30
[[charger]]
address = "127.0.0.1:5025"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30
[[charger]]
address = "127.0.0.1:5026"
max_current_a = 32.0
failsafe_current_a = 6.0
failsafe_timeout_s = 30

[[heat_pump]]
address = "127.0.0.1:5027"
rated_kw = 14.0
min_kw = 3.0

# The battery counts as a controllable device under §14a and goes idle on
# its own if the gateway is silent for 30 s.
[[battery]]
address = "127.0.0.1:5028"
capacity_kwh = 100.0
max_charge_kw = 50.0
max_discharge_kw = 50.0
min_soc_pct = 10.0
max_soc_pct = 95.0
watchdog_s = 30

[iec104]
bind = "0.0.0.0:2404"
common_address = 1
deadband_kw = 1.0
# Without any control centre connected: "hold" the last commands (default),
# or "release" dim and feed-in limit after link_loss_release_s seconds.
on_link_loss = "hold"
link_loss_release_s = 900
# Uncomment for TLS with mutual authentication (IEC 62351-3 style).
# See certs/README.md to generate demo certificates.
# [iec104.tls]
# cert = "certs/demo/station.pem"
# key = "certs/demo/station.key.pem"
# client_ca = "certs/demo/ca.pem"

[api]
bind = "127.0.0.1:8080"
web_root = "web"
